<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Kanban</title>
  <link rel="stylesheet" href="${stylesUri}">
</head>
<body>

  <div class="toolbar">
    <button id="btnAddColumn">+ Nueva Columna</button>
    <button id="btnOpenTagModal" class="secondary">🏷️ Gestionar Etiquetas</button>
    <label style="display: flex; align-items: center; gap: 6px;">
      Color del Tablero:
      <span class="color-picker-wrapper" title="Color del Tablero">
        🎨
        <input type="color" id="boardColorPicker">
      </span>
    </label>
  </div>

  <div id="board" class="board"></div>

  <!-- Modal para Etiquetas -->
  <div id="tagModal" class="modal">
    <div class="modal-content">
      <h3>Etiquetas del Tablero</h3>
      <div id="tagsList"></div>
      
      <h4 id="tagModalTitle">Crear Etiqueta</h4>
      <input type="text" id="newTagName" placeholder="Nombre de etiqueta">
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
        <label class="color-picker-wrapper" title="Color de etiqueta">
          🎨
          <input type="color" id="newTagColor" value="#89b4fa">
        </label>
        <button id="btnCreateTag">Agregar Etiqueta</button>
        <button id="btnCancelEditTag" class="secondary" style="display: none;">Cancelar</button>
      </div>
      <div style="margin-top: 12px; text-align: right;">
        <button id="btnCloseTagModal" class="secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Tarjeta -->
<div id="editCardModal" class="modal">
  <div class="modal-content">
    <h3>Editar Tarjeta</h3>
    <input type="text" id="editCardTitleInput" placeholder="Título de la tarjeta">
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
      <button id="btnCancelEditCard" class="secondary">Cancelar</button>
      <button id="btnSaveEditCard">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal para Editar Título de Columna -->
  <div id="editColModal" class="modal">
    <div class="modal-content">
      <h3>Editar Nombre de la Columna</h3>
      <input type="text" id="editColTitleInput" placeholder="Nombre de la columna">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelEditCol" class="secondary">Cancelar</button>
        <button id="btnSaveEditCol">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Agregar Columna -->
  <div id="addColModal" class="modal">
    <div class="modal-content">
      <h3>Nueva Columna</h3>
      <input type="text" id="addColTitleInput" placeholder="Nombre de la columna">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelAddCol" class="secondary">Cancelar</button>
        <button id="btnSaveAddCol">Crear Columna</button>
      </div>
    </div>
  </div>

  <!-- Modal para Agregar Tarjeta -->
  <div id="addCardModal" class="modal">
    <div class="modal-content">
      <h3>Nueva Tarjeta</h3>
      <input type="text" id="addCardTitleInput" placeholder="Título de la tarjeta">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelAddCard" class="secondary">Cancelar</button>
        <button id="btnSaveAddCard">Crear Tarjeta</button>
      </div>
    </div>
  </div>

  <!-- Modal para Confirmar Eliminación de Columna -->
  <div id="deleteColModal" class="modal">
    <div class="modal-content">
      <h3>Eliminar Columna</h3>
      <p>¿Estás seguro de que deseas eliminar esta columna y todas sus tarjetas?</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
        <button id="btnCancelDeleteCol" class="secondary">Cancelar</button>
        <button id="btnConfirmDeleteCol" style="background-color: #ef4444; color: white;">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Confirmar Eliminación de Tarjeta -->
  <div id="deleteCardModal" class="modal">
    <div class="modal-content">
      <h3>Eliminar Tarjeta</h3>
      <p>¿Estás seguro de que deseas eliminar esta tarjeta?</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
        <button id="btnCancelDeleteCard" class="secondary">Cancelar</button>
        <button id="btnConfirmDeleteCard" style="background-color: #ef4444; color: white;">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Seleccionar Etiquetas en una Tarjeta -->
  <div id="cardTagsModal" class="modal">
    <div class="modal-content">
      <h3>Asignar Etiquetas</h3>
      
      <!-- Filtro de búsqueda -->
      <input type="text" id="tagSearchInput" placeholder="🔍 Buscar etiqueta..." style="margin-bottom: 12px; width: 100%;">

      <!-- Lista de etiquetas con checkboxes -->
      <div id="cardTagsListContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 6px;">
        <!-- Se renderizan dinámicamente -->
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelCardTags" class="secondary">Cancelar</button>
        <button id="btnSaveCardTags">Guardar</button>
      </div>
    </div>
  </div>

  <script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
