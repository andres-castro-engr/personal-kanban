<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="${stylesUri}">
</head>
<body>

  <div class="toolbar">
    <button id="btnAddColumn">+ New Column</button>
    <button id="btnOpenTagModal" class="secondary" data-modal-open="tagModal">🏷️ Manage Tags</button>
    <label style="display: flex; align-items: center; gap: 6px;">
      Board Color:
      <span class="color-picker-wrapper" title="Board Color">
        🎨
        <input type="color" id="boardColorPicker">
      </span>
    </label>
  </div>

  <div id="board" class="board"></div>

  <!-- Tags Modal -->
  <div id="tagModal" class="modal">
    <div class="modal-content">
      <h3>Board Tags</h3>
      <div id="tagsList"></div>
      
      <h4 id="tagModalTitle">Create Tag</h4>
      <input type="text" id="newTagName" placeholder="Tag name">
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
        <label class="color-picker-wrapper" title="Tag color">
          🎨
          <input type="color" id="newTagColor" value="#89b4fa">
        </label>
        <button id="btnCreateTag">Add Tag</button>
        <button id="btnCancelEditTag" class="secondary" style="display: none;">Cancel</button>
      </div>
      <div style="margin-top: 12px; text-align: right;">
        <button id="btnCloseTagModal" class="secondary" data-modal-close="tagModal">Close</button>
      </div>
    </div>
  </div>

  <!-- Edit Card Modal -->
  <div id="editCardModal" class="modal">
  <div class="modal-content">
    <h3>Edit Card</h3>
    <input type="text" id="editCardTitleInput" placeholder="Card title">
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
      <button id="btnCancelEditCard" class="secondary" data-modal-close="editCardModal">Cancel</button>
      <button id="btnSaveEditCard">Save</button>
    </div>
  </div>
</div>

<!-- Edit Column Title Modal -->
  <div id="editColModal" class="modal">
    <div class="modal-content">
      <h3>Edit Column Name</h3>
      <input type="text" id="editColTitleInput" placeholder="Column name">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelEditCol" class="secondary" data-modal-close="editColModal">Cancel</button>
        <button id="btnSaveEditCol">Save</button>
      </div>
    </div>
  </div>

  <!-- Add Column Modal -->
  <div id="addColModal" class="modal">
    <div class="modal-content">
      <h3>New Column</h3>
      <input type="text" id="addColTitleInput" placeholder="Column name">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelAddCol" class="secondary" data-modal-close="addColModal">Cancel</button>
        <button id="btnSaveAddCol">Create Column</button>
      </div>
    </div>
  </div>

  <!-- Add Card Modal -->
  <div id="addCardModal" class="modal">
    <div class="modal-content">
      <h3>New Card</h3>
      <input type="text" id="addCardTitleInput" placeholder="Card title">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelAddCard" class="secondary" data-modal-close="addCardModal">Cancel</button>
        <button id="btnSaveAddCard">Create Card</button>
      </div>
    </div>
  </div>

  <!-- Delete Column Confirmation Modal -->
  <div id="deleteColModal" class="modal">
    <div class="modal-content">
      <h3>Delete Column</h3>
      <p>Are you sure you want to delete this column and all its cards?</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
        <button id="btnCancelDeleteCol" class="secondary" data-modal-close="deleteColModal">Cancel</button>
        <button id="btnConfirmDeleteCol" style="background-color: #ef4444; color: white;">Delete</button>
      </div>
    </div>
  </div>

  <!-- Delete Card Confirmation Modal -->
  <div id="deleteCardModal" class="modal">
    <div class="modal-content">
      <h3>Delete Card</h3>
      <p>Are you sure you want to delete this card?</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
        <button id="btnCancelDeleteCard" class="secondary" data-modal-close="deleteCardModal">Cancel</button>
        <button id="btnConfirmDeleteCard" style="background-color: #ef4444; color: white;">Delete</button>
      </div>
    </div>
  </div>

  <!-- Select Tags for a Card Modal -->
  <div id="cardTagsModal" class="modal">
    <div class="modal-content">
      <h3>Assign Tags</h3>
      
      <!-- Search filter -->
      <input type="text" id="tagSearchInput" placeholder="🔍 Search tag..." style="margin-bottom: 12px; width: 100%;">

      <!-- Tags list with checkboxes -->
      <div id="cardTagsListContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 6px;">
        <!-- Rendered dynamically -->
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button id="btnCancelCardTags" class="secondary" data-modal-close="cardTagsModal">Cancel</button>
        <button id="btnSaveCardTags">Save</button>
      </div>
    </div>
  </div>

  ${scriptTags}
</body>
</html>
